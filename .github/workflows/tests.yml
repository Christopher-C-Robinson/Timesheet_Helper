name: Tests

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Site logic tests (docs/index.html)
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python helper tests
        run: |
          python -m pip install pytest
          python -m pytest -q
